name: Build Mac app

# Chạy khi đẩy tag phiên bản (vd. v0.4.5) hoặc bấm "Run workflow" trên GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # chỉ dùng để gắn DMG vào Release khi đẩy tag

jobs:
  mac-arm64:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Kiểm thử trên macOS
        run: python -m unittest discover -s tests -v

      - name: Đóng gói app + DMG (ký ad-hoc, miễn phí)
        env:
          PYTHON: python
        run: bash packaging/build_mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ToolThu-mac-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30

      - name: Gắn DMG vào Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "Tool Thư $GITHUB_REF_NAME" --notes "Bản Mac (Apple Silicon). Xem Hướng dẫn cài đặt trong DMG." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --clobber
